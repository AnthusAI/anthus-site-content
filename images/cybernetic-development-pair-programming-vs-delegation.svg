<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Pair Programming vs. Delegation</title>
  <desc id="desc">Left, one human paired with one agent by a thick two-way arrow. Right, one human directing a task system that fans out to four agents, which report back into the task system rather than to the human.</desc>
  <line x1="450" y1="20" x2="450" y2="440" stroke="#CCCCCC" stroke-width="1.5" stroke-dasharray="6 5" />

  <text x="225" y="36" font-size="18" font-weight="bold" fill="#333333" text-anchor="middle">Pair Programming (1:1)</text>
  <circle cx="140" cy="180" r="36" fill="#1f77b4" />
  <text x="140" y="186" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">You</text>
  <circle cx="310" cy="180" r="36" fill="#9B1B30" />
  <text x="310" y="186" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Agent</text>
  <line x1="178" y1="180" x2="272" y2="180" stroke="#333333" stroke-width="6" />
  <polygon points="178,180 190,173 190,187" fill="#333333" />
  <polygon points="272,180 260,173 260,187" fill="#333333" />
  <text x="225" y="255" font-size="13.5" font-style="italic" fill="#6B6B6B" text-anchor="middle">Every unit of work costs</text>
  <text x="225" y="273" font-size="13.5" font-style="italic" fill="#6B6B6B" text-anchor="middle">a unit of your attention.</text>

  <text x="675" y="36" font-size="18" font-weight="bold" fill="#333333" text-anchor="middle">Delegation (1:N)</text>
  <circle cx="675" cy="95" r="36" fill="#1f77b4" />
  <text x="675" y="101" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">You</text>
  <line x1="675" y1="131" x2="675" y2="152" stroke="#333333" stroke-width="3" />
  <polygon points="675,152 668,140 682,140" fill="#333333" />

  <rect x="580" y="152" width="190" height="55" rx="8" fill="#C9DCEA" stroke="#7C97AC" stroke-width="1.5" />
  <text x="675" y="176" font-size="14.5" font-weight="bold" fill="#333333" text-anchor="middle">Task System</text>
  <text x="675" y="194" font-size="12" fill="#6B6B6B" text-anchor="middle">(issues in the repo)</text>

  <line x1="660" y1="207" x2="515" y2="299" stroke="#7C97AC" stroke-width="2" />
  <polygon points="515,299 528,296 522,309" fill="#7C97AC" />
  <line x1="525" y1="299" x2="670" y2="207" stroke="#7C97AC" stroke-width="1.5" stroke-dasharray="5 4" />
  <polygon points="670,207 657,207 663,196" fill="#7C97AC" />

  <line x1="668" y1="207" x2="608" y2="299" stroke="#7C97AC" stroke-width="2" />
  <polygon points="608,299 619,293 624,306" fill="#7C97AC" />
  <line x1="618" y1="299" x2="678" y2="207" stroke="#7C97AC" stroke-width="1.5" stroke-dasharray="5 4" />
  <polygon points="678,207 665,204 674,215" fill="#7C97AC" />

  <line x1="682" y1="207" x2="702" y2="299" stroke="#7C97AC" stroke-width="2" />
  <polygon points="702,299 692,293 686,305" fill="#7C97AC" />
  <line x1="712" y1="299" x2="692" y2="207" stroke="#7C97AC" stroke-width="1.5" stroke-dasharray="5 4" />
  <polygon points="692,207 700,217 685,215" fill="#7C97AC" />

  <line x1="690" y1="207" x2="795" y2="299" stroke="#7C97AC" stroke-width="2" />
  <polygon points="795,299 784,299 790,287" fill="#7C97AC" />
  <line x1="805" y1="299" x2="700" y2="207" stroke="#7C97AC" stroke-width="1.5" stroke-dasharray="5 4" />
  <polygon points="700,207 712,208 706,219" fill="#7C97AC" />

  <circle cx="520" cy="322" r="22" fill="#9B1B30" />
  <circle cx="613" cy="322" r="22" fill="#9B1B30" />
  <circle cx="706" cy="322" r="22" fill="#9B1B30" />
  <circle cx="799" cy="322" r="22" fill="#9B1B30" />
  <text x="675" y="372" font-size="13" fill="#6B6B6B" text-anchor="middle">agents</text>
  <text x="675" y="410" font-size="13.5" font-style="italic" fill="#6B6B6B" text-anchor="middle">They report to the task system, not back to you.</text>
</svg>
