name: Deploy site to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GitHub evicts Actions cache entries after seven days without access by default.
  # Reuse the cache every five days so the next content deployment stays incremental.
  schedule:
    - cron: '17 4 */5 * *'

# Keep deploys serial: overlapping s3 sync --delete can delete files from a newer build.
# Let the active build finish so a slow cold build can seed the Gatsby cache.
concurrency:
  group: deploy-s3-cloudfront
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DIST_ID: ${{ vars.CLOUDFRONT_DIST_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
    - name: Checkout pushed content
      uses: actions/checkout@v4
      with:
        path: content
        persist-credentials: false

    - name: Checkout Anth.us site repo with submodules
      uses: actions/checkout@v4
      with:
        repository: AnthusAI/Anth.us
        ref: main
        submodules: recursive
        path: site
        persist-credentials: false

    - name: Overwrite submodule with pushed content
      run: |
        rm -rf site/src/site-content
        cp -a content/ site/src/site-content/
        rm -rf site/src/site-content/.git site/src/site-content/.github
        mkdir -p site/static/blog
        cp -a content/redirects/. site/static/blog/

    - name: Validate deployment configuration
      if: github.event_name != 'schedule'
      run: |
        missing=()
        for name in AWS_REGION S3_BUCKET CLOUDFRONT_DIST_ID AWS_DEPLOY_ROLE_ARN; do
          if [ -z "${!name}" ]; then
            missing+=("$name")
          fi
        done
        if [ "${#missing[@]}" -gt 0 ]; then
          printf 'Missing required GitHub Actions variables: %s\n' "${missing[*]}" >&2
          exit 1
        fi

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: npm
        cache-dependency-path: site/package-lock.json

    - name: Restore Gatsby cache
      uses: actions/cache@v4
      with:
        # Gatsby refuses to trust .cache unless public sits next to it -- it treats
        # .cache-without-public as a corrupt/incomplete state and wipes the cache before
        # building ("We've detected that the Gatsby cache is incomplete... deleting your
        # site's cache"). Caching .cache alone therefore did nothing: every run restored
        # .cache, saw no public/, discarded it, and did a full cold build anyway. Both
        # paths have to be cached together, matching how Anth.us's own deploy.yml already
        # does it -- that workflow just isn't the one that runs on a content push.
        path: |
          site/.cache
          site/public
        key: gatsby-content-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}-${{ github.sha }}
        restore-keys: |
          gatsby-content-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}-
          gatsby-content-${{ runner.os }}-

    - name: Install dependencies
      run: npm ci
      working-directory: site

    - name: Build Gatsby site
      run: npm run build
      working-directory: site
      env:
        CI: true

    - name: Normalize and verify embedded global CSS
      run: node scripts/normalize-gatsby-inline-css.cjs
      working-directory: site

    - name: Verify rendered posts match cached query data
      run: node scripts/verify-gatsby-posts-cache.cjs
      working-directory: site

    - name: Save Gatsby cache
      if: success()
      uses: actions/cache@v4
      with:
        path: |
          site/.cache
          site/public
        key: gatsby-content-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}-${{ github.sha }}

    - name: Configure AWS credentials via OIDC
      if: github.event_name != 'schedule'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Sync to S3
      if: github.event_name != 'schedule'
      run: aws s3 sync site/public/ s3://${S3_BUCKET} --delete --no-progress

    - name: Invalidate CloudFront
      if: github.event_name != 'schedule'
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${CLOUDFRONT_DIST_ID} \
          --paths "/*"
