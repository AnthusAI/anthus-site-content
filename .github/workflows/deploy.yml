name: Deploy site to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

# Overlapping s3 sync --delete races delete pages that a newer deploy just uploaded.
concurrency:
  group: deploy-s3-cloudfront
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DIST_ID: ${{ vars.CLOUDFRONT_DIST_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
    - name: Checkout pushed content
      uses: actions/checkout@v4
      with:
        path: content
        persist-credentials: false

    - name: Checkout Anth.us site repo with submodules
      uses: actions/checkout@v4
      with:
        repository: AnthusAI/Anth.us
        ref: main
        submodules: recursive
        path: site
        persist-credentials: false

    - name: Overwrite submodule with pushed content
      run: |
        rm -rf site/src/site-content
        cp -a content/ site/src/site-content/
        rm -rf site/src/site-content/.git site/src/site-content/.github
        mkdir -p site/static/blog
        cp -a content/redirects/. site/static/blog/

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: npm
        cache-dependency-path: site/package-lock.json

    # Restore the immediately previous deploy's .cache + public so Gatsby can
    # incrementally rebuild changed pages and reuse processed images in
    # public/static. Do NOT use prefix restore-keys here — that was the Sol
    # stale-HTML bug (bed4d65 / PR #1).
    - name: Restore Gatsby cache
      uses: actions/cache@v4
      with:
        path: |
          site/.cache
          site/public
        key: gatsby-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}-${{ github.sha }}
        restore-keys: |
          gatsby-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}-${{ github.event.before }}

    - name: Install dependencies
      run: npm ci
      working-directory: site

    - name: Build Gatsby site
      run: npm run build 2>&1 | tee ../gatsby-build.log
      working-directory: site
      env:
        CI: true

    - name: Report incremental build stats
      if: always()
      run: |
        echo "### Gatsby incremental build stats" >> "$GITHUB_STEP_SUMMARY"
        if [ -f gatsby-build.log ]; then
          rg "Checking for changed pages|IMAGE_PROCESSING jobs|Done building" gatsby-build.log \
            | tail -5 >> "$GITHUB_STEP_SUMMARY" || true
        else
          echo "Build log not found." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Save Gatsby cache
      if: success()
      uses: actions/cache@v4
      with:
        path: |
          site/.cache
          site/public
        key: gatsby-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}-${{ github.sha }}

    - name: Configure AWS credentials via OIDC
      if: env.AWS_DEPLOY_ROLE_ARN != ''
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Sync to S3
      if: env.AWS_DEPLOY_ROLE_ARN != ''
      run: aws s3 sync site/public/ s3://${S3_BUCKET} --delete --no-progress

    - name: Invalidate CloudFront
      if: env.AWS_DEPLOY_ROLE_ARN != ''
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${CLOUDFRONT_DIST_ID} \
          --paths "/*"
